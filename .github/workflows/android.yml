name: Android APK

# main 에 올라가거나 직접 실행하면 시험용(debug) APK를 만듭니다.
# 결과: Actions 실행 화면의 Artifacts, 그리고 Releases 의 "android-latest"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm install

      - name: Build web app for Android
        run: npm run build:app

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../yaksok-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yaksok-debug-apk
          path: yaksok-debug.apk
          retention-days: 30

      - name: Publish to "android-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 약속 안드로이드 앱 (시험용 최신)
          prerelease: true
          make_latest: false
          body: |
            시험용(debug) APK입니다. 휴대폰에서 내려받아 설치하세요.
            설치할 때 "출처를 알 수 없는 앱 설치"를 한 번 허용해야 해요.
            빌드 커밋: ${{ github.sha }}
          files: yaksok-debug.apk
